kind = "web"
previewPath = "/"
title = "Chat com IA"
version = "1.0.0"
id = "artifacts/chat-ia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23007

[services.development]
run = "pnpm --filter @workspace/chat-ia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chat-ia", "run", "build" ]
publicDir = "artifacts/chat-ia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23007"
BASE_PATH = "/"
